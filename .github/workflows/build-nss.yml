name: Build NSS Firmware (360V6 + JDCloud RE-CS-02)

on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: "laipeng668/immortalwrt 分支"
        default: "openwrt-25.12"
        required: true
      lan_ip:
        description: "默认 LAN IP"
        default: "10.1.1.1"
        required: true
      bundle_clash_core:
        description: "把 OpenClash Meta 内核打进固件 (约 +15~30MB)"
        type: boolean
        default: true
      publish_release:
        description: "编译完成后发布到 Releases"
        type: boolean
        default: false

permissions:
  contents: write

env:
  SOURCE_REPO: https://github.com/laipeng668/immortalwrt.git
  TZ: Asia/Singapore

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: 360v6
            device: qihoo_360v6
          - id: jdcloud-re-cs-02
            device: jdcloud_re-cs-02

    steps:
      - name: 检出本仓库 (config/ 和 scripts/)
        uses: actions/checkout@v4

      - name: 释放磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force || true
          df -h /

      - name: 安装编译依赖
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib \
            g++-multilib git gnutls-dev gperf haveged help2man intltool lib32gcc-s1 libc6-dev-i386 libelf-dev \
            libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses-dev libpython3-dev \
            libreadline-dev libssl-dev libtool libyaml-dev zlib1g-dev lld llvm lrzsz mkisofs msmtp nano \
            ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip python3-ply python3-docutils \
            python3-pyelftools qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo uglifyjs \
            upx-ucl unzip vim wget xmlto xxd zstd

      - name: 克隆源码
        run: |
          git clone --depth 1 -b "${{ inputs.source_branch }}" "$SOURCE_REPO" openwrt
          git -C openwrt log -1 --format='commit %H%n%s'

      - name: 更新 feeds + 加入第三方插件
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          bash "$GITHUB_WORKSPACE/scripts/01-custom-packages.sh" "${{ matrix.id }}"
          ./scripts/feeds install -a

      - name: 默认设置 (IP / 主题 / OpenClash 内核)
        working-directory: openwrt
        env:
          NEW_IP: ${{ inputs.lan_ip }}
          BUNDLE_CLASH_CORE: ${{ inputs.bundle_clash_core }}
        run: bash "$GITHUB_WORKSPACE/scripts/02-default-settings.sh"

      - name: 生成 .config
        working-directory: openwrt
        run: bash "$GITHUB_WORKSPACE/scripts/03-gen-config.sh" "${{ matrix.id }}"

      - name: 下载源码包
        working-directory: openwrt
        run: |
          make download -j8
          find dl -size -1024c -exec ls -l {} \; -exec rm -f {} \; || true

      - name: 编译固件
        working-directory: openwrt
        run: make -j$(($(nproc) + 1)) || make -j1 V=s

      - name: 整理产物
        if: ${{ !cancelled() }}
        working-directory: openwrt
        run: |
          mkdir -p ../out
          find bin/targets -type f \( -name "*${{ matrix.device }}*" -o -name "sha256sums" \) -exec cp {} ../out/ \; || true
          cp .config ../out/${{ matrix.id }}.config || true
          ls -lh ../out

      - name: 上传产物
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.id }}
          path: out/*
          if-no-files-found: warn

  release:
    needs: build
    if: ${{ inputs.publish_release }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: nss-${{ github.run_number }}
          name: NSS firmware #${{ github.run_number }}
          files: release/*
